controller_frequency: 20          # 20.0
controller_patience:  15.0        # 15.0

recovery_behavior_enabled: False


TebLocalPlannerROS:
  map_frame: odom          # 注意：建议改为 odom，原先的 odom 容易因视觉标定漂移导致控制抖动
  odom_topic: Odometry


  # ################ GoalTolerance ################
  xy_goal_tolerance: 0.10
  yaw_goal_tolerance: 0.10
  free_goal_vel: False  # 控制到目标点的速度为0
  # trans_stopped_vel: 0.1
  # theta_stopped_vel: 0.1


  # ################ Robot ################
  max_vel_x: 1.2
  max_vel_x_backwards: 0.4
  max_vel_theta: 1.05
  acc_lim_x: 1.4
  acc_lim_theta: 1.5
  transform_tolerance: 0.5
  # ********************** Carlike robot parameters ********************
  min_turning_radius: 0.0       #【修改】设为 0.0。代表机器人拥有原地自旋（自转半径为0）的能力！ Min turning radius of the carlike robot (compute value using a model or adjust with rqt_reconfigure manually)
  wheelbase: 0.0                 # 【修改】设为 0.0。差速模型不需要轴距 Wheelbase of our robot
  cmd_angle_instead_rotvel: False # 【修改】设为 False！底盘需要接收正常的角速度(rad/s)，而不是前轮偏转角！ stage simulator takes the angle instead of the rotvel as input (twist message)
  # ********************************************************************
  footprint_model: # types: "point", "circular", "two_circles", "line", "polygon"
    # type: "line"
    type: "polygon"
    # line_start: [-0.2, 0.0] # for type "line"
    # line_end: [0.2, 0.0] # for type "line"
    vertices: [[0.5, 0.4], [-0.5, 0.4], [-0.5, -0.4], [0.5, -0.4]]


  # ################ Trajectory ################
  teb_autosize: True
  dt_ref: 0.3  # 期望的轨迹时间分辨率  0.2时规划比较流畅
  dt_hysteresis: 0.1  # 根据当前时间分辨率自动调整大小的滞后现象，通常约为。建议使用dt ref的10%
  global_plan_overwrite_orientation: True # 覆盖由全局规划器路径点的方向
  allow_init_with_backwards_motion: False
  complete_global_plan: False
  max_global_plan_lookahead_dist: 3.0  # 指定考虑优化的全局计划子集的最大长度
  global_plan_prune_distance: 1.0  #
  force_reinit_new_goal_dist: 1.0
  force_reinit_new_goal_angular: 0.78
  feasibility_check_no_poses: 5 #每个采样间隔的姿态可行性分析数，default：4
  feasibility_check_lookahead_distance: -1.0
  exact_arc_length: False  # 一般用true. 如果为true，则在速度，加速度和转弯速率计算中使用精确的弧长(计算三角函数，会增加cpu负担)，否则使用两个位姿点的直线距离做近似。
  publish_feedback: False  # 发布包含完整轨迹和活动障碍物的反馈，在可视化部分
  control_look_ahead_poses: 2
  prevent_look_ahead_poses_near_goal: 5
  min_samples: 8
  max_samples: 15
  # ViaPoints
  global_plan_viapoint_sep: -1 # [-0.1, 5.0] 正数才启用。调整全局路径上选取的航迹点的间隔，应根据机器人的尺寸大小调整.
  via_points_ordered: False


  # Obstacles
  min_obstacle_dist: 0.35  # 0.3 # 与障碍的最小期望距离,注意，teb_local_planner本身不考虑膨胀半径
  inflation_dist: 0.60
  include_costmap_obstacles: True #应否考虑到局部costmap的障碍
  include_dynamic_obstacles: True
  dynamic_obstacle_inflation_dist: 0.70
  costmap_obstacles_behind_robot_dist: 0.3 #考虑后面n米内的障碍物
  obstacle_poses_affected: 10 #为了保持距离，每个障碍物位置都与轨道上最近的位置相连。
  legacy_obstacle_association: False
  obstacle_association_force_inclusion_factor: 1.5
  obstacle_association_cutoff_factor: 5.0
  obstacle_proximity_ratio_max_vel: 0.80
  obstacle_proximity_lower_bound: 0.35
  obstacle_proximity_upper_bound: 0.75
  costmap_converter_plugin: "costmap_converter::CostmapToPolygonsDBSMCCH"
  costmap_converter_spin_thread: True
  costmap_converter_rate: 8

  # Optimization
  no_inner_iterations: 5
  no_outer_iterations: 3
  optimization_activate: True
  optimization_verbose: False
  penalty_epsilon: 0.1
  weight_max_vel_x: 2
  weight_max_vel_theta: 1
  weight_acc_lim_x: 5
  weight_acc_lim_theta: 4
  weight_kinematics_nh: 1000
  weight_kinematics_forward_drive: 8
  weight_kinematics_turning_radius: 1
  weight_optimaltime: 0.7
  weight_obstacle: 38
  weight_inflation: 0.2
  weight_dynamic_obstacle: 50 # not in use yet
  weight_dynamic_obstacle_inflation: 0.2
  weight_velocity_obstacle_ratio: 3
  alternative_time_cost: False # not in use yet
  selection_alternative_time_cost: False

  # Homotopy Class Planning
  enable_homotopy_class_planning: True
  enable_multithreading: True
  max_number_classes: 3
  max_number_plans_in_current_class: 2
  selection_cost_hysteresis: 1.5
  selection_prefer_initial_plan: 1.0
  selection_obst_cost_scale: 5.0
  selection_viapoint_cost_scale: 1.0
  selection_dropping_probability: 0.0
  switching_blocking_period: 3.5
  roadmap_graph_no_samples: 10
  roadmap_graph_area_width: 5
  h_signature_prescaler: 0.5
  h_signature_threshold: 0.1
  obstacle_keypoint_offset: 0.60
  obstacle_heading_threshold: 0.45
  visualize_hc_graph: False
  simple_exploration: True

  # Recovery
  shrink_horizon_backup: True
  shrink_horizon_min_duration: 10
  oscillation_recovery: True
  oscillation_v_eps: 0.1
  oscillation_omega_eps: 0.1
  oscillation_recovery_min_duration: 10
  oscillation_filter_duration: 10
