base_local_planner: "dwa_local_planner/DWAPlannerROS"
controller_frequency: 20          # 20.0
controller_patience:  15.0        # 15.0


DWAPlannerROS:
  # General Parameters
  holonomic_robot: false
  global_frame_id: camera_init
  odom_topic: Odometry
  publish_traj_pc : true
  publish_cost_grid_pc: false           # false


  # Robot Configuration Parameters   Defaults
  max_vel_x: 0.4
  min_vel_x: 0.0
  max_vel_y: 0.0
  min_vel_y: 0.0
  max_vel_theta: 1.2
  min_vel_theta: 0.2
  max_vel_trans: 0.4
  min_vel_trans: 0.0
  acc_lim_x: 5.0                    # 2.5
  acc_lim_y: 0.0                     # 2.5
  acc_lim_theta: 3.2                # 3.2
  acc_lim_trans: 5.0                # 2.5
  
  trans_stopped_vel: 0.1
  theta_stopped_vel: 0.1


  # Goal Tolerance Parameters        Defaults
  xy_goal_tolerance: 0.2             # 0.1
  yaw_goal_tolerance: 0.1           # 0.05
  latch_xy_goal_tolerance: true      # false


  # Forward Simulation Parameters    Defaults
  sim_time: 1.5                      # 1.7
  sim_granularity: 0.025              # 0.025
  angular_sim_granularity: 0.05      # 0.10 (1 degree = 0.017 rad)
  vx_samples: 6                     # 3
  vy_samples: 1                     # 10
  vth_samples: 20                    # 20
  use_dwa: true                      # true


  # Trajectory Scoring Parameters    Defaults
  path_distance_bias: 32.0           # 32.0
  goal_distance_bias: 48.0           # 24.0
  occdist_scale: 0.5                # 0.01
  forward_point_distance: 0.325      # 0.325
  stop_time_buffer: 0.20             # 0.20
  scaling_speed: 0.25                 # 0.25
  max_scaling_factor: 0.20           # 0.20
  twirling_scale: 0.20              # 0.00

  # Oscillation Prevention Parameters  Defaults
  oscillation_reset_dist: 0.05          # 0.05
  oscillation_reset_angle: 0.20        # 0.20
  
  
  # Global Plan Parameters             Defaults
  prune_plan: true                    # true
  